name: Fetch NYT sudoku
on:
  schedule:
    - cron: "15 14 * * *"   # NYT publishes the next day's puzzles ~14:00 UTC
    - cron: "0 20 * * *"    # retry later in case the first run was early
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - run: python scripts/fetch_nyt.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add puzzles/nyt.json
          git diff --cached --quiet || { git commit -m "NYT puzzles $(date -u +%F)"; git push; }
