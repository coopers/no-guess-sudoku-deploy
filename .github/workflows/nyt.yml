name: Fetch NYT sudoku
on:
  schedule:
    # NYT posts the next day's puzzles the evening before (~10 PM ET weekdays,
    # ~6 PM ET weekends, times vary). Poll every 2 hours; commits only on change.
    - cron: "20 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - run: python scripts/fetch_nyt.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add puzzles/nyt.json
          git diff --cached --quiet || { git commit -m "NYT puzzles $(date -u +%F)"; git push; }
